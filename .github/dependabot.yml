version: 2
updates:
  # Python dependencies here are declared as FLOORS (`>=`), not pins - both the
  # dev group and examples/requirements.txt. Nothing resolves against those
  # floors: CI installs the latest matching release either way. So a version
  # update PR against them changes nothing except making the declared floor
  # narrower, and it arrives every week forever.
  #
  # `open-pull-requests-limit: 0` disables *version* updates while leaving
  # security updates untouched, which is the half that carries real signal.
  # Revisit if this project ever pins.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Actions ARE pinned (`@v4`), so these bumps are real and have to be taken.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
