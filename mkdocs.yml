site_name: queryspy
site_description: N+1 and query-budget detection for SQLAlchemy 2.0, sync and async.
site_url: https://sqla-native.github.io/queryspy/
repo_url: https://github.com/sqla-native/queryspy
repo_name: sqla-native/queryspy
edit_uri: edit/main/docs/
copyright: MIT licensed &middot; not affiliated with the SQLAlchemy project

theme:
  name: material
  icon:
    logo: material/database-search
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - What it catches: detectors.md
  - Guides:
      - pytest: pytest.md
      - Baselines: baseline.md
      - ASGI middleware: asgi.md
      - CI and code scanning: ci.md
  - Reference:
      - API: api.md
      - Design notes: design.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sqla-native
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/queryspy/

strict: true
